name: Feature request
description: Propose a bounded improvement to the rewrite contract.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent workflow fails or takes unnecessary work today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: Describe observable behavior, including factual-integrity and failure expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why the current CLI or library surface does not solve it.
    validations:
      required: true
